<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>公会管理工具</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ==========================================
       CSS 变量 — 浅色/深色
       ========================================== */
    :root {
      --bg: #ffffff;
      --bg-sidebar: #f5f5f7;
      --bg-card: #ffffff;
      --bg-hover: rgba(0,0,0,0.04);
      --text: #1d1d1f;
      --text-secondary: #6e6e73;
      --text-tertiary: #aeaeb2;
      --accent: #007AFF;
      --accent-hover: #0062cc;
      --border: #d2d2d7;
      --border-light: #e5e5ea;
      --danger: #ff3b30;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --bg-sidebar: #1c1c1e;
        --bg-card: #1c1c1e;
        --bg-hover: rgba(255,255,255,0.08);
        --text: #f5f5f7;
        --text-secondary: #8e8e93;
        --text-tertiary: #636366;
        --accent: #0A84FF;
        --accent-hover: #409cff;
        --border: #38383a;
        --border-light: #2c2c2e;
        --danger: #ff453a;
        --shadow: 0 1px 3px rgba(255,255,255,0.05);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      font-size: 15px; color: var(--text); background: var(--bg);
      -webkit-font-smoothing: antialiased; min-height: 100vh;
    }

    .app { display: flex; min-height: 100vh; }

    /* ==========================================
       左侧面板 (260px)
       ========================================== */
    .sidebar {
      width: 260px; background: var(--bg-sidebar);
      border-right: 1px solid var(--border-light);
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 10;
    }

    /* --- 区域一：用户身份 --- */
    .sidebar-identity {
      padding: 32px 24px 20px;
      border-bottom: 1px solid var(--border-light);
      background: var(--bg-hover);
    }

    .sidebar-identity .avatar-row {
      display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
    }

    .sidebar-identity .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--accent); color: #ffffff;
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; font-weight: 600; flex-shrink: 0;
    }

    .sidebar-identity .name {
      font-size: 20px; font-weight: 600; color: var(--text);
      line-height: 1.2;
    }

    .sidebar-identity .uid {
      font-size: 13px; color: var(--text-secondary); margin-top: 2px;
    }

    /* --- 区域二：信息概览 --- */
    .sidebar-info {
      flex: 1; padding: 16px 24px; overflow-y: auto;
    }
    .sidebar-info.side-biz {
      flex: 0 0 auto; max-height: 35vh; overflow-y: auto;
    }

    .sidebar-info .section-label {
      font-size: 11px; font-weight: 600; color: var(--text-tertiary);
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px;
    }

    .sidebar-info .field {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-light);
    }

    .sidebar-info .field:last-child { border-bottom: none; }

    .sidebar-info .field .field-label {
      font-size: 14px; color: var(--text-secondary);
    }

    .sidebar-info .field .field-value {
      font-size: 14px; color: var(--text); font-weight: 500;
      text-align: right;
    }

    .sidebar-info .field .badge {
      display: inline-block; padding: 2px 8px; border-radius: 6px;
      font-size: 12px; font-weight: 500;
    }

    .badge-yes { background: #30d158; color: #fff; }
    .badge-no { background: var(--border); color: var(--text-secondary); }
    .badge-admin { background: var(--accent); color: #fff; }

    /* --- 区域三：操作区 --- */
    .sidebar-actions {
      padding: 16px 24px 24px;
      border-top: 1px solid var(--border-light);
      display: flex; flex-direction: column; gap: 8px;
    }

    .btn {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; width: 100%; padding: 10px 16px; border-radius: 10px;
      font-size: 15px; font-weight: 500; font-family: inherit;
      cursor: pointer; border: none;
      transition: all 0.25s ease-in-out; text-decoration: none;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-secondary {
      background: transparent; color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--bg-hover); }

    .btn-danger { background: transparent; color: var(--danger); }
    .btn-danger:hover { background: rgba(255,59,48,0.08); }

    /* ==========================================
       右侧内容区
       ========================================== */
    .content {
      flex: 1; margin-left: 260px; padding: 48px;
      max-width: 1060px;
    }

    .content h1 {
      font-size: 28px; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 6px;
    }

    .content .subtitle {
      font-size: 15px; color: var(--text-secondary); margin-bottom: 36px;
    }

    /* --- 公告板卡片 --- */
    .bulletin-card {
      display:flex; align-items:center; gap:20px;
      background:var(--bg-card); border:1px solid var(--border-light);
      border-radius:14px; padding:16px 20px; margin-bottom:24px;
      box-shadow:var(--shadow); cursor:pointer;
      text-decoration:none; color:inherit;
      transition:all 0.25s ease-in-out;
      max-width:720px;
    }
    .bulletin-card:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(0,0,0,0.12); }
    .bulletin-img-wrap {
      flex-shrink:0; width:100px; height:66px; border-radius:14px;
      overflow:hidden; background:var(--bg-hover);
    }
    .bulletin-img-wrap img { width:100%; height:100%; object-fit:cover; }
    .bulletin-info { min-width:0; }
    .bulletin-label { font-size:12px; color:var(--text2); margin-bottom:4px; }
    .bulletin-title { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* --- 卡片网格 --- */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--bg-card); border: 1px solid var(--border-light);
      border-radius: 14px; padding: 24px; box-shadow: var(--shadow);
      cursor: pointer; transition: all 0.25s ease-in-out;
      text-decoration: none; color: inherit; display: block;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    .card.disabled {
      opacity: 0.4; cursor: not-allowed; pointer-events: none;
    }

    .card.disabled:hover { transform: none; box-shadow: var(--shadow); }

    .card .card-icon {
      font-size: 36px; margin-bottom: 14px;
    }

    .card .card-title {
      font-size: 18px; font-weight: 600; margin-bottom: 6px;
    }

    .card .card-desc {
      font-size: 14px; color: var(--text-secondary); line-height: 1.5;
    }

    /* --- 更新日志 --- */
    .changelog {
      margin-top:40px; padding-top:24px;
      border-top:1px solid var(--border-light);
      max-width:720px;
    }
    .changelog-header {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:12px;
    }
    .changelog-title { font-size:15px; font-weight:600; color:var(--text); }
    .changelog-edit-btn {
      font-size:12px; padding:4px 12px; border-radius:6px;
      border:1px solid var(--border); background:var(--bg-card);
      color:var(--text-secondary); cursor:pointer; font-family:inherit;
    }
    .changelog-edit-btn:hover { background:var(--bg-hover); }
    .changelog-content {
      font-size:14px; color:var(--text-secondary); line-height:1.8;
      white-space:pre-wrap;
    }
    .changelog-content p { margin:0 0 8px 0; }
    .changelog-edit textarea {
      width:100%; padding:10px 14px; border:1px solid var(--border);
      border-radius:8px; font-size:14px; font-family:inherit;
      background:var(--bg-card); color:var(--text); outline:none; resize:vertical;
    }
    .changelog-edit textarea:focus { border-color:var(--accent); }

    /* ==========================================
       响应式
       ========================================== */
    /* 汉堡按钮（仅移动端显示） */
    .hamburger-btn { display: none; background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text); padding: 8px 12px; line-height: 1; position: fixed; top: 10px; right: 10px; z-index: 100; border-radius: 8px; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 89; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

    @media (max-width: 768px) {
      .hamburger-btn { display: flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; }
      .nav-user-mobile { display: block; position: fixed; top: 10px; left: 10px; z-index: 100; font-size: 14px; font-weight: 500; color: var(--text); }
      .sidebar {
        position: fixed; top: 0; right: 0; bottom: 0; left: auto; z-index: 95;
        transform: translateX(100%); transition: transform 0.3s ease;
        width: 280px !important;
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.show { display: block; }
      .content { margin-left: 0 !important; padding: 56px 16px 16px !important; max-width: 100% !important; }
      .card { min-height: auto; }
      .sidebar-actions .btn { min-height: 44px; }
    }
  </style>
</head>
<body>

  <script>
    var SUPABASE_URL = 'https://nifmryfrgfdjjbrdrgpo.supabase.co';
    var SUPABASE_ANON_KEY = 'sb_publishable_AdLuePdaPCWznuSa6D0ruA_dL9K919U';

    var API = {
      headers: function () {
        return {
          apikey: SUPABASE_ANON_KEY,
          Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
        };
      },
      get: async function (path) {
        var res = await fetch(SUPABASE_URL + '/rest/v1/' + path, { headers: this.headers() });
        if (!res.ok) throw new Error(await res.text());
        return res.json();
      },
    };

    var currentUser = null;

    function getUser() {
      var s = localStorage.getItem('guild_current_user');
      if (!s) { window.location.href = 'login.html'; return null; }
      try {
        var u = JSON.parse(s);
        if (!u.id) throw new Error('invalid');
        return u;
      } catch (_) {
        localStorage.removeItem('guild_current_user');
        window.location.href = 'login.html';
        return null;
      }
    }

    function handleLogout() {
      localStorage.removeItem('guild_current_user');
      window.location.href = 'login.html';
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('show');
      var btn = document.getElementById('hamburgerBtn');
      btn.textContent = document.getElementById('sidebar').classList.contains('open') ? '✕' : '☰';
    }

    function updateSidebar(u) {
      // 区域一
      document.getElementById('sbAvatar').textContent = (u.display_name || '?').charAt(0);
      document.getElementById('sbName').textContent = u.display_name;
      document.getElementById('sbUid').textContent = u.uid;

      // 区域二
      document.getElementById('fiName').textContent = u.display_name;
      document.getElementById('fiUid').textContent = u.uid;
      document.getElementById('fiFullLike').textContent = u.is_full_like ? '是' : '否';
      document.getElementById('fiLevel').textContent = u.level;
      document.getElementById('fiVip').textContent = u.vip_level;
      document.getElementById('fiAdmin').textContent = u.is_admin ? '是' : '否';
      document.getElementById('fiPosition').textContent = u.position || '成员';
      document.getElementById('fiHammer').textContent = (u.big_hammer||0)+'大/'+(u.small_hammer||0)+'小';

      // 管理员入口
      if (u.is_admin || u.position === '副会长') {
        document.getElementById('btnAdmin').style.display = 'flex';
      }
    }

    async function loadChangelog(){
  try{
    var rows=await API.get('calculator_data?calculator_type=eq._changelog&select=data&limit=1');
    if(rows.length>0&&rows[0].data&&rows[0].data.content){
      var c=rows[0].data;
      var html='';
      c.content.split('\n\n').forEach(function(p){ html+='<p>'+escHtml(p)+'</p>'; });
      document.getElementById('changelogView').innerHTML=html;
    }else{
      document.getElementById('changelogView').innerHTML='<span style="color:var(--text-tertiary);">暂无更新日志</span>';
    }
    if(currentUser&&currentUser.is_admin){
      document.getElementById('btnEditChangelog').style.display='inline-block';
    }
  }catch(e){}
}

function toggleChangelogEdit(){
  var view=document.getElementById('changelogView');
  var edit=document.getElementById('changelogEdit');
  var btn=document.getElementById('btnEditChangelog');
  if(edit.style.display==='none'){
    // Populate textarea from current view content
    var text=view.textContent.trim();
    if(text==='暂无更新日志')text='';
    document.getElementById('changelogTextarea').value=text;
    view.style.display='none'; edit.style.display='block';
    btn.textContent='👁️ 预览';
  }else{
    view.style.display=''; edit.style.display='none';
    btn.textContent='✏️ 编辑';
  }
}

async function saveChangelog(){
  var content=document.getElementById('changelogTextarea').value.trim();
  try{
    var existing=await API.get('calculator_data?calculator_type=eq._changelog&select=id&limit=1');
    if(existing.length>0)await API.del('calculator_data?id=eq.'+existing[0].id);
    await API.post('calculator_data',{member_id:currentUser.id,calculator_type:'_changelog',data:{
      content:content,updated_at:new Date().toISOString(),updated_by:currentUser.display_name||currentUser.uid
    }});
    // Refresh view
    var html='';
    content.split('\n\n').forEach(function(p){ html+='<p>'+escHtml(p)+'</p>'; });
    document.getElementById('changelogView').innerHTML=html||'<span style="color:var(--text-tertiary);">暂无更新日志</span>';
    toggleChangelogEdit();
  }catch(e){ console.error(e); alert('保存失败: '+e.message); }
}

function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function loadBulletin(){
  try{
    var rows=await API.get('calculator_data?calculator_type=eq._bulletin&select=data&limit=1');
    if(rows.length>0&&rows[0].data&&rows[0].data.title){
      var b=rows[0].data;
      document.getElementById('cardBulletin').style.display='flex';
      document.getElementById('bulletinTitle').textContent=b.title;
      var img=document.getElementById('bulletinThumb');
      if(b.image_url){ img.src=b.image_url; img.style.display=''; }
      else img.style.display='none';
    }
  }catch(e){}
}

async function init() {
      currentUser = getUser();
      if (!currentUser) return;

      // 从 Supabase 拉最新数据
      try {
        var data = await API.get('members?id=eq.' + currentUser.id + '&select=*');
        if (data && data.length > 0) {
          var db = data[0];
          currentUser.display_name = db.display_name;
          currentUser.uid = db.uid;
          currentUser.is_full_like = db.is_full_like;
          currentUser.level = db.level;
          currentUser.vip_level = db.vip_level;
          currentUser.is_admin = db.is_admin;
          currentUser.position = db.position;
          currentUser.big_hammer = db.big_hammer || 0;
          currentUser.small_hammer = db.small_hammer || 0;
          currentUser.hammer_updated_at = db.hammer_updated_at;
          localStorage.setItem('guild_current_user', JSON.stringify(currentUser));
        }
      } catch (err) {
        console.warn('拉取最新数据失败，使用缓存:', err.message);
      }

      updateSidebar(currentUser);
      loadPositions();
      loadSideBiz();
      loadBulletin();
      loadChangelog();
      // 蘑菇的计算器（全局锁：锁关全员可见，锁开仅超管）
	      fetch('https://nifmryfrgfdjjbrdrgpo.supabase.co/rest/v1/calculator_data?calculator_type=eq._global_lock&select=data&limit=1',{
	        headers:{apikey:'sb_publishable_AdLuePdaPCWznuSa6D0ruA_dL9K919U',Authorization:'Bearer sb_publishable_AdLuePdaPCWznuSa6D0ruA_dL9K919U'}
	      }).then(function(r){return r.json();}).then(function(rows){
	        var locked=rows.length>0&&rows[0].data&&rows[0].data.locked;
	        if(!locked||currentUser.is_admin){
	          document.getElementById('cardCalculator').style.display='block';
	        }
	      }).catch(function(){});
      // 访问记录入口（仅超级管理员/副会长）
      if(currentUser.is_admin || currentUser.position==='副会长') {
        document.getElementById('cardVisits').style.display='block';
      }
      // 记录访问
      logVisit();
    }

    function logVisit(){
      try {
        fetch(SUPABASE_URL+'/rest/v1/visit_logs',{
          method:'POST',
          headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
          body:JSON.stringify({member_id:currentUser.id,member_name:currentUser.display_name||currentUser.uid,page:'主界面'})
        });
      } catch(e){}
    }

    async function loadSideBiz(){
      try {
        var cur = await API.get('side_business_versions?is_current=eq.true&select=id&limit=1');
        if(!cur||!cur.length){ document.getElementById('sideBizList').innerHTML='暂无版本数据'; return; }
        var allocs = await API.get('side_business_allocation?version_id=eq.'+cur[0].id+'&select=business_name,capacity,members&order=sort_order.asc');
        var myBiz = [];
        allocs.forEach(function(a){
          var members=a.members||'';
          var matchByName=members.indexOf(currentUser.display_name)>=0;
          var matchByPos=(currentUser.position==='会长'&&members.indexOf('会长')>=0)||(currentUser.position==='副会长'&&members.indexOf('副会长')>=0);
          if(matchByName||matchByPos){
            myBiz.push(a.business_name+' ('+a.capacity+')');
          }
        });
        document.getElementById('sideBizList').innerHTML = myBiz.length>0 ? myBiz.map(function(b){return '<div style="padding:2px 0;">🔹 '+b+'</div>';}).join('') : '今日无副业安排';
      } catch(e){ console.error('loadSideBiz error:', e); document.getElementById('sideBizList').innerHTML='加载失败: '+e.message; }
    }

    async function loadPositions(){
      try {
        var data = await API.get('members?select=display_name,position&or=(position.eq.会长,position.eq.副会长)');
        var hz = data.filter(function(m){return m.position==='会长';}).map(function(m){return m.display_name;}).join('、') || '--';
        var fz = data.filter(function(m){return m.position==='副会长';}).map(function(m){return m.display_name;}).join('、') || '--';
        document.getElementById('positionLine').textContent = '会长：'+hz+' ｜ 副会长：'+fz;
      } catch(e){ console.warn('加载职务失败:', e.message); }
    }

    init();
  </script>
