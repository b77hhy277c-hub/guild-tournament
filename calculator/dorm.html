<script>

};

function getUser(){var s=localStorage.getItem('guild_current_user');if(!s){window.location.href='../login.html';return null;}try{var u=JSON.parse(s);if(!u.id)throw Error();return u;}catch(_){localStorage.removeItem('guild_current_user');window.location.href='../login.html';return null;}}
function toast(m,t){var e=document.getElementById('toast');e.textContent=m;e.className='toast '+(t||'ok')+' show';clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show');},2500);}

/* ===== 计算内核（与桌面版完全一致） ===== */
var BASE=8.0223,PER_LEVEL=0.0077,SLOT_MAX=6,ROOM_COUNT=16,GROUP_SIZE=4,GROUP_COUNT=4;
var ATTRS=[
{key:1,name:'歌',color:'#34c759'},
{key:2,name:'舞',color:'#ff3b30'},
{key:3,name:'演',color:'#0071e3'},
{key:4,name:'艺',color:'#af52de'}
];
var ROOMS=['春雨居','春燕居','春花居','春芽居','夏荷阁','夏凉阁','夏田阁','夏竹阁','秋香榭','秋暮榭','秋吟榭','秋染榭','冬寒涧','冬霜涧','冬雪涧','冬暖涧'];

function slotGift(level){
var L=Number(level);
if(!isFinite(L)||L<=0)return 0;
return (BASE+L*PER_LEVEL)*Math.ceil(L/10);
}

function greedyGroups(gifts){
var groups=[],g;
for(g=0;g<GROUP_COUNT;g+=1)groups.push({idx:[],sum:0});
for(var i=0;i<gifts.length;i+=1){
var target=-1;
for(g=0;g<GROUP_COUNT;g+=1){
if(groups[g].idx.length>=GROUP_SIZE)continue;
if(target===-1){target=g;continue;}
if(groups[g].sum<groups[target].sum-1e-9)target=g;
else if(Math.abs(groups[g].sum-groups[target].sum)<=1e-9&&groups[g].idx.length<groups[target].idx.length)target=g;
}
if(target===-1)break;
groups[target].idx.push(i);
groups[target].sum+=gifts[i];
}
return groups;
}

function optimize(gifts){
var n=gifts.length;
if(n!==ROOM_COUNT)return null;
var total=0,i;
for(i=0;i<n;i+=1)total+=gifts[i];
var mean=total/GROUP_COUNT;
var order=gifts.map(function(v,k){return k;}).sort(function(a,b){return(gifts[b]-gifts[a])||(a-b);});
var v=order.map(function(k){return gifts[k];});
var best={spread:Infinity,dev:Infinity,sums:null,groups:null};
var init=greedyGroups(v);
(function(){
var sums=init.map(function(g){return g.sum;});
var dev=0;
for(var k=0;k<sums.length;k+=1)dev+=(sums[k]-mean)*(sums[k]-mean);
best={spread:Math.max.apply(null,sums)-Math.min.apply(null,sums),dev:dev,sums:sums,groups:init.map(function(g){return g.idx.slice();})};
})();
var stack=[],used=new Array(n).fill(false);
function record(){
var last=[],k;
for(k=0;k<n;k+=1)if(!used[k])last.push(k);
var lastSum=0;
for(k=0;k<last.length;k+=1)lastSum+=v[last[k]];
var sums=stack.map(function(g){return g.sum;}).concat([lastSum]);
var spread=Math.max.apply(null,sums)-Math.min.apply(null,sums);
var dev=0;
for(k=0;k<sums.length;k+=1)dev+=(sums[k]-mean)*(sums[k]-mean);
var better=spread<best.spread-1e-9||(spread<=best.spread+1e-9&&dev<best.dev-1e-9);
if(better){best={spread:spread,dev:dev,sums:sums,groups:stack.map(function(g){return g.idx.slice();}).concat([last])};}
}
function dfs(){
if(stack.length===GROUP_COUNT-1){record();return;}
var first=-1,k;
for(k=0;k<n;k+=1)if(!used[k]){first=k;break;}
if(first===-1)return;
var rest=[];
for(k=first+1;k<n;k+=1)if(!used[k])rest.push(k);
var pick=[];
function choose(start,left){
if(left===0){
var idx=[first].concat(pick),sum=0,j;
for(j=0;j<idx.length;j+=1)sum+=v[idx[j]];
for(j=0;j<idx.length;j+=1)used[idx[j]]=true;
stack.push({idx:idx,sum:sum});
var max=-Infinity,min=Infinity;
for(j=0;j<stack.length;j+=1){
if(stack[j].sum>max)max=stack[j].sum;
if(stack[j].sum<min)min=stack[j].sum;
}
if(max-min<=best.spread+1e-9)dfs();
stack.pop();
for(j=0;j<idx.length;j+=1)used[idx[j]]=false;
return;
}
for(var m=start;m<=rest.length-left;m+=1){
pick.push(rest[m]);
choose(m+1,left-1);
pick.pop();
}
}
choose(0,GROUP_SIZE-1);
}
dfs();
if(!best.groups)return null;
var groups=best.groups.map(function(group){return group.map(function(k){return order[k];}).sort(function(a,b){return a-b;});});
return{groups:groups,sums:best.sums,spread:best.spread,total:total,mean:mean};
}

/* ===== 界面 ===== */
var POS_NAMES=['最高组','次高组','第三组','最低组'];
var ATTR_MAP={};
ATTRS.forEach(function(a){ATTR_MAP[a.key]=a;});

var tbody=document.getElementById('tbody');
var resultEl=document.getElementById('result');
var chipsEl=document.getElementById('chips');
var vTotal=document.getElementById('vTotal');

var inputs=[];

var order=[1,2,3,4];
var dragIndex=-1;
var loadedLevels=null;
var loadedOrder=null;

function isPermutation(list){
if(!Array.isArray(list)||list.length!==4)return false;
var seen={};
for(var i=0;i<list.length;i+=1){
var k=Number(list[i]);
if(!ATTR_MAP[k]||seen[k])return false;
seen[k]=true;
}
return true;
}

function renderOrder(){
var html='';
order.forEach(function(key,i){
var a=ATTR_MAP[key];
html+='<div class="chip" draggable="true" tabindex="0" role="button" data-key="'+key+'" style="--c:'+a.color+'" title="'+a.name+'：'+POS_NAMES[i]+'（拖动或点击调整）"><span class="cn">'+a.name+'</span><span class="cp">'+POS_NAMES[i]+'</span></div>';
});
chipsEl.innerHTML=html;
bindChips();
}

function moveChip(index,delta){
var to=index+delta;
if(to<0)to=order.length-1;
if(to>=order.length)to=0;
if(to===index)return;
var item=order.splice(index,1)[0];
order.splice(to,0,item);
afterOrderChange();
}

function afterOrderChange(){
renderOrder();
saveData();
recalc();
}

function bindChips(){
var nodes=chipsEl.querySelectorAll('.chip');
Array.prototype.forEach.call(nodes,function(node,index){
node.addEventListener('click',function(){moveChip(index,-1);});
node.addEventListener('keydown',function(e){
if(e.key==='ArrowLeft'){e.preventDefault();moveChip(index,-1);}
else if(e.key==='ArrowRight'){e.preventDefault();moveChip(index,1);}
});
node.addEventListener('dragstart',function(e){
dragIndex=index;
node.classList.add('dragging');
if(e.dataTransfer){
e.dataTransfer.effectAllowed='move';
try{e.dataTransfer.setData('text/plain',String(index));}catch(err){}
}
});
node.addEventListener('dragend',function(){node.classList.remove('dragging');dragIndex=-1;});
node.addEventListener('dragover',function(e){e.preventDefault();});
node.addEventListener('drop',function(e){
e.preventDefault();
var from=dragIndex;
if(from===-1){
var dt=e.dataTransfer&&e.dataTransfer.getData('text/plain');
from=dt===''||dt==null?-1:Number(dt);
}
if(from===-1||from===index||isNaN(from)||from>=order.length)return;
var item=order.splice(from,1)[0];
order.splice(index,0,item);
dragIndex=-1;
afterOrderChange();
});
});
}

function money(v){
return v.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function buildTable(){
var html='';
for(var r=0;r<ROOM_COUNT;r+=1){
html+='<tr>';
html+='<td class="idx">'+(r+1)+'</td>';
html+='<td class="rname">'+ROOMS[r]+'</td>';
for(var c=0;c<SLOT_MAX;c+=1){
html+='<td><input class="lv" type="number" inputmode="numeric" min="0" step="1" data-r="'+r+'" data-c="'+c+'" placeholder="0" aria-label="'+ROOMS[r]+' 槽'+(c+1)+'"></td>';
}
html+='<td class="gift giftcol zero" id="gift-'+r+'">0.00</td>';
html+='</tr>';
}
tbody.innerHTML=html;
inputs=Array.prototype.slice.call(tbody.querySelectorAll('input.lv'));
inputs.forEach(function(el){el.addEventListener('input',onChange);});
}

function readLevels(){
var levels=[];
for(var r=0;r<ROOM_COUNT;r+=1)levels.push([0,0,0,0,0,0]);
inputs.forEach(function(el){
var r=Number(el.getAttribute('data-r'));
var c=Number(el.getAttribute('data-c'));
var val=Number(el.value);
levels[r][c]=isFinite(val)&&val>0?val:0;
});
return levels;
}

function fillLevels(levels){
inputs.forEach(function(el){
var r=Number(el.getAttribute('data-r'));
var c=Number(el.getAttribute('data-c'));
var v=levels&&levels[r]?levels[r][c]:0;
el.value=v>0?String(v):'';
});
}

var timer=null;
function onChange(){
if(timer)clearTimeout(timer);
timer=setTimeout(function(){recalc();saveData();},160);
}

function recalc(){
timer=null;
var levels=readLevels();
var gifts=levels.map(function(lv){return lv.reduce(function(s,x){return s+slotGift(x);},0);});
gifts.forEach(function(g,r){
var cell=document.getElementById('gift-'+r);
cell.textContent=g>0?money(g):'0.00';
cell.className='gift giftcol'+(g>0?'':' zero');
});
var total=gifts.reduce(function(a,b){return a+b;},0);
if(total<=0){
vTotal.textContent='—';
vMean.textContent='—';
vSpread.textContent='—';
resultEl.innerHTML='<div class="empty">填入家具等级后，这里会给出四组分配方案</div>';
return;
}
var t0=performance.now();
var opt=optimize(gifts);
var cost=performance.now()-t0;
vTotal.textContent=money(total);
vMean.textContent=money(opt.mean);
vSpread.textContent=money(opt.spread);
var ranked=opt.groups.map(function(group,i){return{group:group,sum:opt.sums[i]};}).sort(function(a,b){return(b.sum-a.sum)||(a.group[0]-b.group[0]);});
var html='';
ranked.forEach(function(item,gi){
var attr=ATTR_MAP[order[gi]]||ATTRS[gi];
var diff=item.sum-opt.mean;
var sign=diff>=0?'+':'−';
html+='<div class="group">';
html+='<div class="ghead">';
html+='<span class="tag" style="background:'+attr.color+'">'+attr.name+'</span>';
html+='<span class="gsum">'+money(item.sum)+'</span>';
html+='<span class="gdiff">'+sign+money(Math.abs(diff))+'</span>';
html+='</div><div class="grooms">';
item.group.map(function(index){return{index:index,gift:gifts[index]};}).sort(function(a,b){return(b.gift-a.gift)||(a.index-b.index);}).forEach(function(room){
html+='<div class="groom">';
html+='<span class="rn">'+(room.index+1)+'</span>';
html+='<span style="flex:1">'+ROOMS[room.index]+'</span>';
html+='<span class="rg">'+money(room.gift)+'</span>';
html+='</div>';
});
html+='</div></div>';
});
resultEl.innerHTML=html;
hintEl.textContent='已按最优解计算 · '+Math.round(cost)+' ms';
}

var _saveTimer=null;
function saveData(){
clearTimeout(_saveTimer);
_saveTimer=setTimeout(function(){
var data={levels:readLevels(),order:order};
API.get('calculator_data?member_id=eq.'+curUser.id+'&calculator_type=eq.'+CALC_TYPE+'&select=id&limit=1')
.then(function(ex){if(ex&&ex.length)return API.patch('calculator_data?id=eq.'+ex[0].id,{data:data,updated_at:new Date().toISOString()});else return API.post('calculator_data',{member_id:curUser.id,calculator_type:CALC_TYPE,data:data});})
.catch(function(e){console.warn('saveData:',e);});
},500);
}

function loadSavedData(){
return API.get('calculator_data?member_id=eq.'+curUser.id+'&calculator_type=eq.'+CALC_TYPE+'&select=data&limit=1')
.then(function(rows){return(rows&&rows.length>0)?rows[0].data:{};})

}

async function init(){
curUser=getUser();if(!curUser)return;
document.getElementById('navUser').textContent=curUser.display_name||curUser.uid;
// Global lock check
try{
var lockRows=await API.get('calculator_data?calculator_type=eq._global_lock&select=data&limit=1');
if(lockRows.length>0&&lockRows[0].data&&lockRows[0].data.locked&&!curUser.is_admin){
alert('计算器维护中，仅超级管理员可访问');
window.location.href='../index.html';
return;
}
}catch(e){}
buildTable();
var saved=await loadSavedData();
if(saved&&Array.isArray(saved.levels)&&saved.levels.length===ROOM_COUNT){
fillLevels(saved.levels);
}
if(saved&&isPermutation(saved.order))order=saved.order.map(Number);
renderOrder();
recalc();
}
init();
