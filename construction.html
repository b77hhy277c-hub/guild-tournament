<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>今日建设</title>
<style>
:root{--bg:#fff;--bg2:#f5f5f7;--card:#fff;--hover:rgba(0,0,0,0.04);--text:#1d1d1f;--text2:#6e6e73;--text3:#aeaeb2;--accent:#007AFF;--accent-h:#0062d1;--border:#d2d2d7;--border-l:#e5e5ea;--shadow:0 4px 20px rgba(0,0,0,0.08);--r:12px;}
@media(prefers-color-scheme:dark){:root{--bg:#000;--bg2:#1c1c1e;--card:#1c1c1e;--hover:rgba(255,255,255,0.08);--text:#f5f5f7;--text2:#8e8e93;--text3:#636366;--accent:#0A84FF;--accent-h:#409cff;--border:#38383a;--border-l:#2c2c2e;--shadow:0 1px 3px rgba(255,255,255,0.05);}}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;font-size:14px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh;}
.navbar{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 20px;border-bottom:1px solid var(--border-l);position:sticky;top:0;background:var(--bg);z-index:10;backdrop-filter:blur(20px);}
.navbar a{color:var(--accent);text-decoration:none;font-size:14px;}
.navbar .title{font-size:16px;font-weight:600;}
.navbar .user{font-size:13px;color:var(--text2);}
.main{max-width:960px;margin:0 auto;padding:24px;}
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;padding:14px 20px;background:var(--bg2);border-radius:var(--r);border:1px solid var(--border-l);}
.top-bar .hint{font-size:13px;color:var(--text2);}
.btn{padding:10px 22px;border-radius:8px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;border:none;transition:background 0.2s;}
.btn-danger{background:#ff3b30;color:#fff;}
.btn-danger:hover{background:#e03020;}
.card{background:var(--card);border:1px solid var(--border-l);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:600px;}
th,td{padding:7px 5px;text-align:center;border-bottom:1px solid var(--border-l);font-size:13px;}
th{font-size:12px;font-weight:600;color:var(--text2);background:var(--bg2);white-space:nowrap;}
td{vertical-align:middle;}
/* 间隔底色 */
tbody tr:nth-child(even) td{background:rgba(127,127,127,0.05);}
tbody tr:hover td{background:var(--hover);}
/* 拖拽 */
tr.draggable{cursor:grab;}
tr.draggable:active{cursor:grabbing;}
tr.drag-over td{border-top:2px solid var(--accent);}
.drag-handle{color:var(--text3);font-size:16px;user-select:none;-webkit-user-select:none;cursor:grab;width:36px;}
.member-name{text-align:left;font-weight:500;white-space:nowrap;padding-right:16px;}
/* 大号可点击 checkbox */
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;vertical-align:middle;}
input[type=checkbox]:disabled{cursor:not-allowed;opacity:0.5;}
.group-col{border-left:2px solid var(--border-l);}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-size:14px;font-weight:500;z-index:200;opacity:0;pointer-events:none;transition:opacity 0.3s;box-shadow:var(--shadow);}
.toast.show{opacity:1;}
.toast.ok{background:#30d158;color:#fff;}
.toast.err{background:#ff3b30;color:#fff;}
.empty-state{text-align:center;padding:40px;color:var(--text3);}
@media(max-width:768px){.main{padding:12px 8px;}.top-bar{flex-direction:column;align-items:stretch;}.top-bar .btn{width:100%;}th,td{padding:8px 4px;font-size:12px;}input[type=checkbox]{width:20px;height:20px;}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<nav class="navbar">
<a href="index.html">← 返回主界面</a>
<span class="title">🏗️ 今日建设</span>
<span class="user" id="navUser">--</span>
</nav>

<div class="main">
<div class="top-bar">
<span class="hint" id="loadStatus">加载中...</span>
<button class="btn btn-danger" id="btnClear" onclick="clearAllChecks()" style="display:none;">🔔 点名完毕，一键清空</button>
</div>

<div class="card">
<div class="table-wrap">
<table>
<thead>
<tr>
<th rowspan="2" style="width:36px;">序</th>
<th rowspan="2" class="member-name">成员</th>
<th rowspan="2" class="group-col">中级建设</th>
<th rowspan="2" class="group-col">高级建设</th>
<th colspan="2" class="group-col">道具建设</th>
<th colspan="4" class="group-col">初级建设</th>
</tr>
<tr>
<th class="group-col">1</th><th>2</th>
<th class="group-col">1</th><th>2</th><th>3</th><th>4</th>
</tr>
</thead>
<tbody id="memberBody"><tr><td colspan="10" class="empty-state">加载成员中...</td></tr></tbody>
</table>
</div>
</div>
</div>

<script>
var SUPABASE_URL='https://nifmryfrgfdjjbrdrgpo.supabase.co';
var SUPABASE_ANON_KEY='sb_publishable_AdLuePdaPCWznuSa6D0ruA_dL9K919U';
var API={
h:function(ct){var hd={apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+SUPABASE_ANON_KEY};if(ct)hd['Content-Type']='application/json';return hd;},
get:function(p){return fetch(SUPABASE_URL+'/rest/v1/'+p,{headers:this.h()}).then(function(r){if(!r.ok)throw Error(r.statusText);return r.json();});},
post:function(p,b){return fetch(SUPABASE_URL+'/rest/v1/'+p,{method:'POST',headers:Object.assign({'Prefer':'return=representation'},this.h(1)),body:JSON.stringify(b)}).then(function(r){if(!r.ok)throw Error(r.statusText);return r.json();});},
del:function(p){return fetch(SUPABASE_URL+'/rest/v1/'+p,{method:'DELETE',headers:this.h(1)}).then(function(r){if(!r.ok)throw Error(r.statusText);});}
};

var CHECK_KEYS=['c1','c2','c3','c4','m1','h1','i1','i2'];
var CALC_TYPE='_construction';

var curUser=null;
var members=[];       // [{id, display_name, uid, position}]
var checks={};        // { member_id: {c1:true,...} }
var order=[];         // [member_id, ...]
var canEdit=false;

function getUser(){var s=localStorage.getItem('guild_current_user');if(!s){window.location.href='login.html';return null;}try{var u=JSON.parse(s);if(!u.id)throw Error();return u;}catch(_){localStorage.removeItem('guild_current_user');window.location.href='login.html';return null;}}
function toast(m,t){var e=document.getElementById('toast');e.textContent=m;e.className='toast '+(t||'ok')+' show';clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show');},2500);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function loadMembers(){
try{
var rows=await API.get('members?select=id,display_name,uid,position&limit=1000');
members=rows;
// 默认排序：会长 → 副会长 → 其他，同职位按名称
var posRank={会长:0,副会长:1};
members.sort(function(a,b){
var ra=posRank[a.position]!==undefined?posRank[a.position]:2;
var rb=posRank[b.position]!==undefined?posRank[b.position]:2;
if(ra!==rb)return ra-rb;
return (a.display_name||'').localeCompare(b.display_name||'','zh');
});
}catch(e){console.error(e);document.getElementById('memberBody').innerHTML='<tr><td colspan="10" class="empty-state">成员加载失败: '+esc(e.message)+'</td></tr>';}
}

async function loadSaved(){
try{
var rows=await API.get('calculator_data?calculator_type=eq.'+CALC_TYPE+'&select=data&limit=1');
if(rows.length>0&&rows[0].data){
var d=rows[0].data;
if(d.order&&Array.isArray(d.order))order=d.order;
if(d.checks&&typeof d.checks==='object')checks=d.checks;
}
}catch(e){console.warn('loadSaved:',e);}
}

function applyOrder(){
// order 只保留仍存在的成员，新成员追加到末尾
var ids={};members.forEach(function(m){ids[m.id]=true;});
var ordered=[];
order.forEach(function(id){if(ids[id])ordered.push(id);});
members.forEach(function(m){if(ordered.indexOf(m.id)<0)ordered.push(m.id);});
order=ordered;
}

function memberById(id){return members.find(function(m){return m.id===id;});}

function renderTable(){
applyOrder();
var html='';
order.forEach(function(mid,idx){
var m=memberById(mid);
if(!m)return;
var chk=checks[mid]||{};
var disabled=canEdit?'':'disabled';
html+='<tr class="'+(canEdit?'draggable':'')+'" data-mid="'+esc(mid)+'" '+(canEdit?'draggable="true"':'')+' ondragstart="onDragStart(event,\''+esc(mid)+'\')" ondragover="onDragOver(event)" ondrop="onDrop(event,\''+esc(mid)+'\')" ondragend="onDragEnd()">';
html+='<td class="drag-handle">'+(canEdit?'⋮⋮':'')+'</td>';
html+='<td class="member-name">'+esc(m.display_name||m.uid)+'</td>';
// 中级 1
html+='<td class="group-col"><input type="checkbox" data-mid="'+esc(mid)+'" data-key="m1" '+(chk.m1?'checked':'')+' '+disabled+' onchange="onCheck(this)"/></td>';
// 高级 1
html+='<td class="group-col"><input type="checkbox" data-mid="'+esc(mid)+'" data-key="h1" '+(chk.h1?'checked':'')+' '+disabled+' onchange="onCheck(this)"/></td>';
// 道具建设 2
for(var j=1;j<=2;j++){
var k2='i'+j;
html+='<td'+(j===1?' class="group-col"':'')+'><input type="checkbox" data-mid="'+esc(mid)+'" data-key="'+k2+'" '+(chk[k2]?'checked':'')+' '+disabled+' onchange="onCheck(this)"/></td>';
}
// 初级建设 4
for(var i=1;i<=4;i++){
var k='c'+i;
html+='<td'+(i===1?' class="group-col"':'')+'><input type="checkbox" data-mid="'+esc(mid)+'" data-key="'+k+'" '+(chk[k]?'checked':'')+' '+disabled+' onchange="onCheck(this)"/></td>';
}
html+='</tr>';
});
document.getElementById('memberBody').innerHTML=html;
document.getElementById('loadStatus').textContent='共 '+members.length+' 位成员'+(canEdit?'（可编辑）':'（只读）');
}

function onCheck(el){
var mid=el.dataset.mid,key=el.dataset.key;
if(!checks[mid])checks[mid]={};
checks[mid][key]=el.checked;
saveData();
}

var _saveTimer=null;
async function saveData(){
clearTimeout(_saveTimer);
_saveTimer=setTimeout(function(){
var data={order:order,checks:checks,updated_at:new Date().toISOString(),updated_by:curUser.display_name||curUser.uid};
API.get('calculator_data?calculator_type=eq.'+CALC_TYPE+'&select=id&limit=10')
.then(function(rows){
var dels=rows.map(function(r){return API.del('calculator_data?id=eq.'+r.id);});
return Promise.all(dels);
})
.then(function(){
return API.post('calculator_data',{member_id:curUser.id,calculator_type:CALC_TYPE,data:data});
})
.then(function(){toast('已保存');})
.catch(function(e){console.error(e);toast('保存失败: '+e.message,'err');});
},500);
}

async function clearAllChecks(){
if(!confirm('确定清空所有勾选状态？表格排序不受影响。'))return;
checks={};
renderTable();
var data={order:order,checks:checks,updated_at:new Date().toISOString(),updated_by:curUser.display_name||curUser.uid};
try{
var rows=await API.get('calculator_data?calculator_type=eq.'+CALC_TYPE+'&select=id&limit=10');
for(var i=0;i<rows.length;i++){await API.del('calculator_data?id=eq.'+rows[i].id);}
await API.post('calculator_data',{member_id:curUser.id,calculator_type:CALC_TYPE,data:data});
toast('✅ 已清空');
}catch(e){console.error(e);toast('清空失败: '+e.message,'err');}
}

/* ===== 拖拽排序 ===== */
var draggedMid=null;
function onDragStart(e,mid){
if(!canEdit)return;
draggedMid=mid;
e.dataTransfer.effectAllowed='move';
try{e.dataTransfer.setData('text/plain',mid);}catch(_){}
e.currentTarget.classList.add('dragging');
}
function onDragOver(e){
if(!canEdit)return;
e.preventDefault();
e.dataTransfer.dropEffect='move';
}
function onDrop(e,targetMid){
if(!canEdit)return;
e.preventDefault();
var row=e.currentTarget;
row.classList.remove('drag-over');
if(!draggedMid||draggedMid===targetMid)return;
var fromIdx=order.indexOf(draggedMid);
var toIdx=order.indexOf(targetMid);
if(fromIdx<0||toIdx<0)return;
order.splice(fromIdx,1);
order.splice(toIdx,0,draggedMid);
renderTable();
saveData();
draggedMid=null;
}
function onDragEnd(){
draggedMid=null;
document.querySelectorAll('tr.draggable').forEach(function(tr){tr.classList.remove('dragging');});
}

async function init(){
curUser=getUser();if(!curUser)return;
document.getElementById('navUser').textContent=curUser.display_name||curUser.uid;
canEdit=curUser.is_admin||curUser.position==='会长'||curUser.position==='副会长';
if(canEdit)document.getElementById('btnClear').style.display='inline-block';
await Promise.all([loadMembers(),loadSaved()]);
renderTable();
}
init();
</script>
</body>
</html>
